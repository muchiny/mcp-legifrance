# SonarQube Cloud, analysé par le job `sonar` de .github/workflows/ci.yml.
# L'analyse automatique de SonarQube Cloud ignore Rust : la laisser désactivée
# (Administration > Analysis Method), les deux méthodes sont en conflit.
sonar.organization=muchiny
sonar.projectKey=muchiny_mcp-legifrance
sonar.projectName=mcp-legifrance
sonar.sourceEncoding=UTF-8

# Périmètre. Code analysé : les crates, xtask, les cibles de fuzz, les workflows
# (règles GitHub Actions) et les scripts shell de la CI. Hors périmètre : docs/
# (plan et annexes de données), spikes/ (code jetable), .claude/, .superpowers/.
sonar.sources=crates,xtask,fuzz/fuzz_targets,.github/workflows,.github/scripts
# Les tests unitaires sont des modules `#[cfg(test)]` dans les fichiers de src/ : il n'y a pas de
# dossier de tests à déclarer. Le script d'auto-test du contrôle d'âge est le seul code de test isolé.
sonar.tests=.github/scripts/tests
sonar.exclusions=**/target/**,.github/scripts/tests/**

# Doublons : `xtask/src/lock_descriptors/sha256.rs` copie `lf-adapter-piste/src/sha256.rs` à dessein
# (xtask ne dépend d'aucun crate `lf-*`, R5 ; l'adaptateur ne dépend pas de `sha2`, R6). La copie
# est documentée en tête de fichier ; sans cette exclusion, toute retouche des deux fichiers compte
# 171 lignes dupliquées dans le code nouveau et fait échouer la porte (seuil de 3 %).
sonar.cpd.exclusions=xtask/src/lock_descriptors/sha256.rs

# Couverture : cobertura.xml vient de `cargo llvm-cov` (job `coverage`, `make cov-cobertura`).
# Les cibles de fuzz, les workflows et les scripts n'ont pas de rapport : sans cette exclusion
# ils compteraient 0 % et feraient échouer la porte qualité.
sonar.rust.cobertura.reportPaths=cobertura.xml
sonar.coverage.exclusions=fuzz/**,.github/**,xtask/src/main.rs

# Avertissements Clippy (lints du workspace : pedantic, unwrap_used, etc.), écrits par
# `make clippy-json` dans le job `sonar`.
sonar.rust.clippyReport.reportPaths=clippy-report.json
