# Configuration de zizmor (make workflow-lint, workflow-lint.yml).
#
# `release.yml` est GÉNÉRÉ par `dist generate` (dist-workspace.toml) et ne s'édite pas à la main : les
# constats qui viennent du gabarit de dist sont écartés ici, fichier par fichier. Les workflows écrits
# à la main (ci.yml, release-gates.yml, smoke-targets.yml, ...) restent soumis à toutes les règles.
rules:
  # permissions: contents: write au niveau du workflow (gabarit dist)
  excessive-permissions:
    ignore:
      - release.yml
  # expansions ${{ }} du gabarit dist
  template-injection:
    ignore:
      - release.yml
  # secrets: inherit vers les jobs personnalisés
  secrets-inherit:
    ignore:
      - release.yml
  # container: dans la matrice de build
  unpinned-images:
    ignore:
      - release.yml
  # uses: ./.github/... (jobs personnalisés)
  self-repository:
    ignore:
      - release.yml
