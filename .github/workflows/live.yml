name: live

# Tests live contre PISTE **sandbox** (04 §13.5, 06 §7.5, T-M2-12) : manuel et hebdomadaire,
# jamais sur `pull_request` (une PR d'un fork n'a pas les secrets), jamais de production (Q3,
# 00 §10). Un passage à la fois (quota PISTE) ; un test à la fois (profil nextest `live`).
# Second job, `bofip` (T-MB-24, ADR-0028) : le portail ouvert de la DGFiP, sans aucun secret.
# Troisième job, `service-public` (T-MS-24, ADR-0033) : les archives ouvertes de la DILA, sans
# aucun secret.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1" # lundi matin, hors des heures de pointe

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Actions épinglées par SHA, version en commentaire : voir ci.yml.
jobs:
  sandbox:
    name: live (sandbox)
    if: github.repository == 'muchiny/mcp-legifrance' # jamais sur un fork
    runs-on: ubuntu-24.04
    environment: piste-sandbox # secrets protégés, approbation possible
    timeout-minutes: 30
    env:
      LF_PISTE_ENV: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.148
      # Compilation SANS secret (L6) : mêmes arguments que l'étape finale, pour que son cache serve et
      # qu'aucun `build.rs` ni macro procédurale ne tourne avec les identifiants dans l'environnement.
      - run: >-
          cargo nextest run -p lf-adapter-piste --test live --test live_m5 --test live_m6 --test live_m7
          --all-features --locked
          --profile live --no-run
      # `--all-features` : les tests sur octets bruts (feature `record`) sont du lot. Les secrets ne
      # sont exposés qu'à cette étape (env:), jamais aux actions tierces ni au texte du script ;
      # elle ne recompile rien.
      - env:
          LF_PISTE_CLIENT_ID: ${{ secrets.LF_PISTE_CLIENT_ID }}
          LF_PISTE_CLIENT_SECRET: ${{ secrets.LF_PISTE_CLIENT_SECRET }}
        run: >-
          cargo nextest run -p lf-adapter-piste --test live --test live_m5 --test live_m6 --test live_m7
          --all-features --locked
          --profile live --run-ignored only --no-fail-fast

  # Portail ouvert `data.economie.gouv.fr` (jeu `bofip-vigueur`, ADR-0028 et ADR-0029) : ni compte,
  # ni clé, donc ni secret ni environnement protégé (contrôlé par `live_job_has_no_piste_secret`).
  # Neuf requêtes par passage, une par seconde. Non bloquant : le portail peut refuser un passage
  # (quota, panne) sans que ce soit un défaut du dépôt.
  bofip:
    name: live (bofip)
    if: github.repository == 'muchiny/mcp-legifrance' # jamais sur un fork
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.148
      - run: >-
          cargo nextest run -p lf-adapter-bofip --test live --locked
          --profile live --run-ignored only --no-fail-fast

  # Archives ouvertes de la DILA (`lecomarquage.service-public.gouv.fr`, ADR-0033) : ni compte, ni
  # clé, donc ni secret ni environnement protégé (contrôlé par `live_service_public_job_has_no_secret`).
  # Deux requêtes par passage, une par public. Non bloquant : le serveur peut refuser un passage
  # (quota, panne) sans que ce soit un défaut du dépôt.
  service-public:
    name: live (service-public)
    if: github.repository == 'muchiny/mcp-legifrance' # jamais sur un fork
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.148
      - run: >-
          cargo nextest run -p lf-adapter-service-public --test live --locked
          --profile live --run-ignored only --no-fail-fast
