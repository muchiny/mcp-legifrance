name: Workflow lint

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions épinglées par SHA, version en commentaire : voir ci.yml.
jobs:
  workflow-lint:
    name: zizmor, actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: zizmor@1.30.1
      - name: actionlint 1.7.12 (somme SHA-256 vérifiée)
        run: |
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm actionlint actionlint.tar.gz
      # GH_TOKEN active les audits en ligne de zizmor (impostor-commit,
      # ref-version-mismatch, known-vulnerable-actions).
      - run: make workflow-lint
        env:
          GH_TOKEN: ${{ github.token }}
