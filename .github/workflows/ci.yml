name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Une PR annule son run précédent ; un push sur main va toujours au bout (06 §7.2).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Actions épinglées par SHA complet, version en commentaire (06 §7.2, D-44) ;
# Dependabot propose les montées. dtolnay/rust-toolchain n'a qu'un tag mobile `v1` :
# SHA du jour de l'épinglage. L'entrée `toolchain:` suit `rust-toolchain.toml`.
jobs:
  check:
    name: fmt, clippy, doc, arch, purity, machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-machete@0.9.2
      - run: make fmt-check lint doc arch purity machete

  # Matrice de 3 OS (00 §10, 06 §7.1) ; couverture et mutation restent sous Linux. Aucun réseau
  # pendant les tests (PT1) : `cargo fetch --locked`, puis les tests hors ligne (CARGO_NET_OFFLINE)
  # derrière des proxys en échec. La clé de rust-cache comprend l'hôte de rustc : une clé par OS.
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo fetch --locked
      # Windows : `make` est absent de l'image windows-2022 (MSYS2 installé mais hors du PATH).
      # Les deux commandes de la cible `test` y sont écrites en clair, à garder identiques au
      # Makefile : écart assumé à « la CI appelle les cibles make » (00 §10).
      - name: tests (aucun réseau hors boucle locale)
        env:
          NEXTEST_PROFILE: ci
          CARGO_NET_OFFLINE: "true"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cargo nextest run --workspace --all-features --locked
            cargo test --workspace --doc --all-features --locked
          else
            make test
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml

  coverage:
    name: couverture 100 %
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: make cov
      # Rapport pour SonarQube Cloud, relu depuis les profils de `make cov` (aucune recompilation).
      - run: make cov-cobertura
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cobertura
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 1

  deny:
    name: cargo-deny
    # Image fixée (06 §7.2) : la règle d'âge emploie bash, git, curl, jq, GNU date et shellcheck.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La règle d'âge compare Cargo.lock à celui de la base (06 §7.2).
          fetch-depth: 0
          persist-credentials: false
      # Deux graphes sous le même deny.toml (M1-D16) : le workspace, puis fuzz/ (son propre Cargo.lock),
      # puis cargo-audit sur fuzz/. Le même contrôle tourne chaque nuit (deny-nightly.yml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check
          arguments: --all-features
          command-arguments: -A license-exception-not-encountered
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          manifest-path: fuzz/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: -A license-not-encountered -A unused-wrapper
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.1
      - run: make audit-fuzz
      # Auto-test du script, hors réseau (shellcheck, verrous et index factices), à chaque run.
      - run: make min-age-selftest
      - name: âge minimal des dépendances (00 §2 ; §9.4)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}                  # jamais interpolé directement dans le script (zizmor)
          SECURITY_FIX: ${{ contains(github.event.pull_request.labels.*.name, 'security-fix') }}
        run: make min-age MIN_AGE_BASE="origin/$BASE_REF" MIN_AGE_DAYS=14   # cible du Makefile (00 §10), qui appelle .github/scripts/check-min-age.sh

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.88 check --workspace --all-targets --locked

  mutants:
    name: mutants (diff de la PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants-diff
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148,cargo-mutants@27.1.0
      # `--locked` vient de .cargo/mutants.toml (additional_cargo_args).
      # BASE_REF passe par l'environnement, jamais interpolé dans le script.
      # Sortie non nulle dès qu'un mutant survit (code 2) ou boucle (TIMEOUT,
      # code 3) : la PR est bloquée. `--baseline skip` (le job test prouve déjà
      # l'arbre sain) impose un `--timeout` explicite, sinon 300 s par mutant.
      - name: Muter le diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" > pr.diff
          cargo mutants --in-diff pr.diff -j 2 --baseline skip --timeout 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-diff
          path: mutants.out

  # SonarQube Cloud (analyse pilotée par la CI : l'analyse automatique ignore Rust). Importe la
  # couverture de `coverage` et un rapport Clippy ; réglages dans sonar-project.properties.
  # Les PR de Dependabot et de forks n'ont pas SONAR_TOKEN : le job est sauté pour elles.
  sonar:
    name: SonarQube Cloud
    needs: coverage
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : Sonar lit le blame pour distinguer le code neuf de l'ancien.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: sonar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-cobertura
      - run: make clippy-json
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
