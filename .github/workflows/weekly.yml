name: Weekly

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions épinglées par SHA, version en commentaire : voir ci.yml.
jobs:
  mutants:
    name: mutants (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants-full
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148,cargo-mutants@27.1.0
      - run: cargo mutants --shard ${{ matrix.shard }}/4 -j 2 --timeout 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [dto_decode, from_html, ids, text, version_date]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      # cargo-fuzz n'a pas de manifeste dans install-action : repli sur cargo-binstall.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.1
      - if: matrix.target != 'dto_decode'
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
      # dto_decode : corps jusqu'à 64 Kio (le défaut de libFuzzer, 4 096 octets, n'atteint ni les
      # chemins profonds ni le plafond de 100 results ; le budget de 200 000 éléments, lui, exige au
      # moins 3 octets par élément, soit environ 600 Kio, et n'est donc pas atteint ici) ; les
      # fixtures de référence servent de graines en second dossier. libFuzzer n'écrit que dans le
      # premier, le corpus par défaut (créé ici, ignoré par git), et ne modifie jamais les graines
      # lues ailleurs. Le dictionnaire porte les noms des champs déclarés par les DTO et le marqueur
      # `sekret` de l'oracle.
      - if: matrix.target == 'dto_decode'
        run: |
          mkdir -p fuzz/corpus/dto_decode
          cargo +nightly fuzz run dto_decode fuzz/corpus/dto_decode \
            crates/lf-adapter-piste/tests/fixtures/reference -- -max_total_time=300 -max_len=65536 \
            -dict=fuzz/dto_decode.dict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
