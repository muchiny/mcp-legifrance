# Configuration cargo-mutants (https://mutants.rs/config-file.html).
# Toute exclusion (`exclude_re`) doit être justifiée en commentaire : mutant
# prouvé équivalent, avec le raisonnement. Le code `#[cfg(test)]` n'est jamais muté.
test_tool = "nextest"
profile = "mutants"
# `--locked` sur chaque appel de cargo (local, diff de PR, balayage hebdomadaire ; 06 §9.4).
additional_cargo_args = ["--locked"]
exclude_globs = [
    "xtask/src/main.rs", # glue d'I/O (cargo metadata, stdout) ; la logique est dans arch.rs
    "fuzz/**", # cibles cargo-fuzz hors workspace (Cargo.toml exclude) : pas du code livré ; filet si le dossier y entrait
]
exclude_re = [
    # dto/de.rs, `ListVisitor::visit_none` : son corps est `Ok(Vec::new())` et `Self::Value` vaut
    # `Vec<T>`. Le mutant `Ok(Default::default())` appelle `<Vec<T> as Default>::default()`, que
    # la bibliothèque standard définit comme `Vec::new()` : même valeur, même capacité nulle, aucune
    # allocation. Aucun test ne peut les distinguer (mutant équivalent, plan 2f, Task 33).
    'ListVisitor<T>>::visit_none -> .* with Ok\(Default::default\(\)\)$',
]
