[package]
name = "lf-application"
description = "Couche application du MCP Légifrance : ports, cas d'usage, échéance des appels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lf-domain.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true
# rt : pour task_local! seulement (Deadline) ; time : Instant et timeout (R2) ; macros : select!
tokio = { workspace = true, features = ["rt", "time", "macros"] }

[features]
# Doublures de test du module `testing` (FakeCorpus, FixedClock, MemoryAuditLog, FailingAuditLog).
# Jamais activée en dépendance normale : `cargo xtask check-arch` (R10) ne l'admet que dans les
# `[dev-dependencies]` des autres membres.
test-support = []

[dev-dependencies]
pretty_assertions.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
