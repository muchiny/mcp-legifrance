[package]
name = "lf-adapter-audit"
description = "Composant interne de mcp-legifrance ; aucune garantie de stabilité d'API. Journal d'audit JSONL (JsonlAuditLog)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# seul crate interne admis (R3, arch.rs)
lf-application.workspace = true
sha2.workspace = true
hex.workspace = true
# verrou consultatif inter-processus sur .mcp-legifrance.lock (00 §2, §7)
fs4 = { workspace = true, features = ["sync"] }
serde_json.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
lf-application = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tempfile.workspace = true

[lints]
workspace = true
