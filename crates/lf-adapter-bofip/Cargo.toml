[package]
name = "lf-adapter-bofip"
description = "Adapter BOFiP du MCP Légifrance : client du portail ouvert de la DGFiP (jeu bofip-vigueur), implémentation du port TaxDoctrine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# port TaxDoctrine, DoctrineError, PortalCode ; port Clock (jour UTC du budget) ; Deadline :
# délai global publié par Audited (variable locale de tâche), lu comme durée restante
lf-application.workspace = true
# valeurs de la doctrine (BoiId, DoctrineQuery, DoctrineHit, DoctrineDoc, Permalink, clean_text)
lf-domain.workspace = true
# client HTTP unique (http.rs), seule porte ouverte à ce crate (ADR-0029, décision 9) ; gzip :
# décompression transparente, bornée après coup ; system-proxy : HTTPS_PROXY / NO_PROXY ;
# rustls : TLS, comme le client PISTE (même résolution, aucun paquet de plus au verrou)
reqwest = { workspace = true, features = ["gzip", "system-proxy", "rustls"] }
# DTO des réponses du portail (dto.rs) : dérivation de Deserialize
serde.workspace = true
# lecture du corps JSON des réponses et des refus (mapping.rs, http.rs)
serde_json.workspace = true
# time : `tokio::time::{Instant, sleep}` de `TokioTimer` ; sync : `OnceCell` du client et
# `Semaphore` des lectures en vol (pace.rs)
tokio = { workspace = true, features = ["time", "sync"] }
# debug! par appel (gabarit, statut, taille) et warn! des anomalies comptées : jamais l'adresse,
# les mots ni le corps
tracing.workspace = true

[dev-dependencies]
# doublure FixedClock du port Clock
lf-application = { workspace = true, features = ["test-support"] }
# `DateTime<Utc>` de l'horloge murale de test (pace.rs) ; R6 ne confine que les dépendances normales
chrono.workspace = true
# net : TcpListener du serveur qui coupe un corps (http.rs)
# test-util : #[tokio::test(start_paused = true)] du minuteur de production (time.rs seulement)
tokio = { workspace = true, features = ["macros", "net", "rt", "io-util", "test-util"] }
# fmt + MakeWriter en mémoire pour capter les événements (testing.rs)
tracing-subscriber.workspace = true
# serveur HTTP simulé des tests de http.rs et de doctrine.rs
wiremock.workspace = true
# GzEncoder (backend Rust pur) pour fabriquer des corps gzip
flate2.workspace = true
# test de propriété des littéraux de la requête (query.rs)
proptest.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
