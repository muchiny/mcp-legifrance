[package]
name = "lf-adapter-piste"
description = "Adapter PISTE du MCP Légifrance : client HTTP de l'API Légifrance, seule implémentation du port LegalCorpus jusqu'en M9."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Deadline : délai global publié par Audited (variable locale de tâche), lu comme durée restante
lf-application.workspace = true
lf-domain.workspace = true
# client HTTP unique (http.rs) ; gzip : décompression transparente, bornée après coup (04 §4.2) ;
# system-proxy : HTTP(S)_PROXY / NO_PROXY ; rustls : TLS, option A, aws-lc (04 §4.1)
reqwest = { workspace = true, features = ["gzip", "system-proxy", "rustls"] }
# Limiteur de débit (limit.rs) : GCRA direct, horloge injectée ; feature std seule
governor.workspace = true
# Date HTTP de Retry-After et de Date (retry.rs) : analyse seule, aucune horloge murale
chrono.workspace = true
# midi Europe/Paris de `version_date` pour le filtre DATE_VERSION (request/search.rs, 04 §6.3) ; base IANA embarquée
chrono-tz.workspace = true
# SecretString : client_secret et jeton, Debug rédigé `[REDACTED]` ; serde : le jeton se désérialise directement en SecretString
secrecy = { workspace = true, features = ["serde"] }
# DTO de la réponse du point d'accès OAuth (dto/) : dérivation de Deserialize
serde.workspace = true
# lecture du corps JSON de la réponse OAuth (auth.rs, dto/)
serde_json.workspace = true
# chemin JSON des erreurs de décodage des corps (dto/decode.rs, 04 §8.5)
serde_path_to_error.workspace = true
thiserror.workspace = true
# time : `tokio::time::{Instant, sleep}` pour `TokioClock` et `TokioSleeper` ; sync : `OnceCell` (http.rs)
tokio = { workspace = true, features = ["time", "sync"] }
# warn! quand un corps de réponse est réparé ou gardé tel quel (stats.rs) : métadonnées seulement, jamais le texte
tracing.workspace = true

[dev-dependencies]
# net : TcpStream des tests de ClosedPort (testing.rs), TcpListener des serveurs de test ;
# test-util : #[tokio::test(start_paused = true)] pour lire Deadline sans attendre (deadline.rs seulement)
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "test-util"] }
# fmt + MakeWriter en mémoire pour capter le warn! de record_decode ; R6 ne confine que les dépendances normales
tracing-subscriber.workspace = true
# serveur HTTP simulé des tests de http.rs
wiremock.workspace = true
# GzEncoder (backend Rust pur) pour fabriquer des corps gzip dans les tests de http.rs
flate2.workspace = true

[lints]
workspace = true
