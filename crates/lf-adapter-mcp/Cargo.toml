[package]
name = "lf-adapter-mcp"
description = "Composant interne de mcp-legifrance ; aucune garantie de stabilité d'API. Adapter MCP (rmcp) : outils, paramètres, vues, cycle de vie stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Harnais `testing.rs` (client rmcp en processus). Jamais activée en dépendance normale :
# `cargo xtask check-arch` (R10) ne l'admet que dans les `[dev-dependencies]` des autres membres.
test-support = ["rmcp/client"]
# M8 : transport Streamable HTTP (annexe D §5.2), profil local seul. Jamais activée par défaut ni dans
# les binaires publiés (Q4). `tokio/net` : `TcpListener` de `serve_http`.
http = ["rmcp/transport-streamable-http-server", "dep:axum", "tokio/net"]

[dependencies]
lf-application.workspace = true
lf-domain.workspace = true
# features par défaut (base64, macros, server) + transport-io (AsyncRwTransport sur stdin/stdout)
rmcp = { workspace = true, features = ["transport-io"] }
# attributs `#[tool]`, `#[tool_router]` et `#[tool_handler]`, importés d'ici ; épinglage exact =3.5.1 (R6, T-M4-15) :
# rmcp déclare une exigence caret sur rmcp-macros (02 §3.0.1)
rmcp-macros.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "rt", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
axum = { workspace = true, optional = true }

[dev-dependencies]
lf-application = { workspace = true, features = ["test-support"] }
insta = { workspace = true, features = ["json"] }
jsonschema.workspace = true
tokio = { workspace = true, features = ["test-util"] }
pretty_assertions.workspace = true
# corps en flux des tests du routeur HTTP (`stream::iter`)
futures.workspace = true
# `ServiceExt::oneshot` : tests du routeur HTTP sans socket (06 §6.2) ; jamais reqwest (ban cargo-deny)
tower.workspace = true

[lints]
workspace = true
