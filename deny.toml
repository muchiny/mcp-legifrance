# cargo-deny : advisories, licences, doublons, sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Zlib : foldhash 0.2.0 (licence seule), tiré par hashbrown 0.16.1, dépendance de governor (T-M2-04)
# ISC, BSD-3-Clause, CDLA-Permissive-2.0 : chaîne TLS de reqwest (aws-lc-rs, aws-lc-sys, rustls-webpki, untrusted, subtle, webpki-root-certs), T-M2-03
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0", "Zlib"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "TLS = rustls uniquement (00 §8)" },
  { crate = "openssl-sys", reason = "TLS = rustls uniquement" },
  { crate = "native-tls", reason = "TLS = rustls uniquement" },
  { crate = "backoff", reason = "non maintenu ; backon retenu (recherche 04 §4.1)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
