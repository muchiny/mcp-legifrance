# cargo-deny : advisories, licences, doublons, sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "TLS = rustls uniquement (00 §8)" },
  { crate = "openssl-sys", reason = "TLS = rustls uniquement" },
  { crate = "native-tls", reason = "TLS = rustls uniquement" },
  { crate = "backoff", reason = "non maintenu ; backon retenu (recherche 04 §4.1)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
