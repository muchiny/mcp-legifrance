[workspace]
resolver = "3"
members = ["crates/lf-domain", "crates/lf-application", "crates/lf-adapter-piste", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/muchiny/mcp-legifrance"
publish = false

[workspace.dependencies]
# internes : exigence « = » + version de [workspace.package] (check-arch, étape 5h)
lf-domain = { path = "crates/lf-domain", version = "=0.0.0" }
lf-application = { path = "crates/lf-application", version = "=0.0.0" }
# externes : exigence au niveau mineur, correctif choisi par le verrou (règle d'âge, 02 §3.0.1) ;
# default-features = false déclaré ici : au niveau d'un membre, l'héritage ne le respecte qu'à partir de 1.99
thiserror = "2.0.21"
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }
secrecy = "0.10"
serde_json = "1.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }
proptest = "1.12.0"
pretty_assertions = "1.4.1"
tokio = { version = "1.53", default-features = false }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
panic = "warn"
unreachable = "warn"
unimplemented = "warn"

# Profil dédié à cargo-mutants (`profile = "mutants"` dans .cargo/mutants.toml) :
# pas d'infos de debug, build plus rapide par mutant.
[profile.mutants]
inherits = "test"
debug = false
