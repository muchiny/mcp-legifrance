[workspace]
resolver = "3"
members = ["crates/lf-domain", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/muchiny/mcp-legifrance"
publish = false

[workspace.dependencies]
thiserror = "2.0.21"
serde_json = "1.0"
proptest = "1.12.0"
pretty_assertions = "1.4.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
panic = "warn"
unreachable = "warn"
unimplemented = "warn"

# Profil dédié à cargo-mutants (`profile = "mutants"` dans .cargo/mutants.toml) :
# pas d'infos de debug, build plus rapide par mutant.
[profile.mutants]
inherits = "test"
debug = false
